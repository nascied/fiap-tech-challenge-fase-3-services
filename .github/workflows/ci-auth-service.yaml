name: CI/CD tooglemaster - auth-service

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'microservices/auth-service/**'

env: 
  SERVICE_NAME: auth-service
  SERVICE_PATH: microservices/auth-service
  GO_VERSION: '1.24'
  AWS_REGION: us-east-1

permissions:
  contents: read

jobs:
  lintcode:
    name: Lint e qualidade de código
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}
   
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configura o ambiente de execução do  Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.SERVICE_PATH }}/go.sum

      - name: go vet
        run: go vet ./...

      - name: Build (garante que compila)
        run: go build ./...

      - name: Testes
        run: go test ./... -v

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ env.SERVICE_PATH }}
          args: --timeout=5m

  security:
    name: Segurança (SAST + SCA)
    needs: lintcode
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.SERVICE_PATH }}/go.sum

      - name: SCA - Trivy filesystem scan (dependências e segredos)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: ${{ env.SERVICE_PATH }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: SCA - govulncheck (CVEs conhecidas nas dependências Go)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: SAST - gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...
  build:
    name: Build da imagem Docker
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}

      - name: "Dockerfile Lint (Hadolint)"
        id: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ env.SERVICE_PATH }}/Dockerfile
          no-fail: true

      - name: Define tag da imagem
        id: meta
        run: echo "tag=${{ env.SERVICE_NAME }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          load: true
          push: false
          tags: ${{ env.SERVICE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy - scan da imagem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ env.SERVICE_NAME }}:${{ steps.meta.outputs.tag }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # A partir daqui só roda em push para main (CD): publica no ECR e atualiza o GitOps
      - name: Configure AWS credentials
        if: github.event.pull_request.merged == true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecrlogin
        if: github.event.pull_request.merged == true
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tag e push para o ECR
        if: github.event.pull_request.merged == true
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          push: true
          tags: ${{ secrets.ECR_REGISTRY_AUTH_SERVICE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Atualiza manifesto GitOps
        if: github.event.pull_request.merged == true
        run: |
          sed -i "s|image: .*|image: ${{ secrets.ECR_REGISTRY_AUTH_SERVICE }}:${{ steps.meta.outputs.tag }}|" \
            gitops/auth-service/auth-service-deployment.yml

      - name: Commit e push do GitOps
        if: github.event.pull_request.merged == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/auth-service/auth-service-deployment.yml
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no manifesto, pulando commit."
            exit 0
          fi
          git commit -m "chore: atualiza imagem do auth-service para ${{ steps.meta.outputs.tag }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Tentativa $i de push falhou, tentando novamente em 5s..."
            sleep 5
          done
    