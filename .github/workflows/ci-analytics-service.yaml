name: CI/CD tooglemaster - analytics-service

on:
  pull_request:
    branches: [main]

env:
  SERVICE_NAME: analytics-service
  SERVICE_PATH: microservices/analytics-service
  PYTHON_VERSION: '3.11'
  AWS_REGION: us-east-1

permissions:
  contents: read

jobs:
  lintcode:
    name: Lint e qualidade de código
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configura o ambiente de execução do Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ${{ env.SERVICE_PATH }}/requirements.txt

      - name: Instala dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verifica sintaxe (compileall)
        run: python -m compileall -q .

      - name: Testes
        run: |
          pip install pytest
          if find . -name 'test_*.py' -o -name '*_test.py' | grep -q .; then
            pytest -v
          else
            echo "Nenhum teste encontrado, pulando."
          fi

      - name: flake8
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --extend-ignore=E203,W503

  security:
    name: Segurança (SAST + SCA)
    needs: lintcode
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ${{ env.SERVICE_PATH }}/requirements.txt

      - name: SCA - Trivy filesystem scan (dependências e segredos)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: ${{ env.SERVICE_PATH }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'
          output: 'trivy-fs-report-${{ env.SERVICE_NAME }}.txt'

      - name: Upload relatório Trivy (filesystem)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report-${{ env.SERVICE_NAME }}
          path: trivy-fs-report-${{ env.SERVICE_NAME }}.txt
          retention-days: 30

      - name: SCA - pip-audit (CVEs conhecidas nas dependências Python)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt > pip-audit-report.txt 2>&1 || true
          cat pip-audit-report.txt

      - name: Upload relatório pip-audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report-${{ env.SERVICE_NAME }}
          path: ${{ env.SERVICE_PATH }}/pip-audit-report.txt
          retention-days: 30

      - name: SAST - bandit
        run: |
          pip install bandit
          bandit -r . -x ./tests > bandit-report.txt 2>&1 || true
          cat bandit-report.txt

      - name: Upload relatório bandit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report-${{ env.SERVICE_NAME }}
          path: ${{ env.SERVICE_PATH }}/bandit-report.txt
          retention-days: 30
  build:
    name: Build da imagem Docker
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}

      - name: "Dockerfile Lint (Hadolint)"
        id: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ env.SERVICE_PATH }}/Dockerfile
          no-fail: true

      - name: Define tag da imagem
        id: meta
        run: echo "tag=${{ env.SERVICE_NAME }}-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          load: true
          push: false
          tags: ${{ env.SERVICE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Trivy - scan da imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.SERVICE_NAME }}:${{ steps.meta.outputs.tag }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # A partir daqui: publica no ECR e atualiza o GitOps
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecrlogin
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tag e push para o ECR
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          push: true
          tags: ${{ secrets.ECR_REGISTRY_ANALYTICS_SERVICE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha

  update-gitops:
    name: Atualiza imagem no GitOps
    needs: build
    uses: nascied/fiap-tech-challenge-fase-3-gitops/.github/workflows/update-image.yaml@main
    with:
      service: analytics-service
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets:
      GITOPS_PUSH_TOKEN: ${{ secrets.GITOPS_PUSH_TOKEN }}
      IMAGE_REPOSITORY: ${{ secrets.ECR_REGISTRY_ANALYTICS_SERVICE }}
