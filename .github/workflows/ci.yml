name: Build Microservices Fase 2

on:
  push:
    branches:
      - feature/devsecops

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fase 3
        uses: actions/checkout@v4

      - name: Clonar fase 2
        run: git clone https://github.com/nascied/tech-challenge-fase-2-fiap.git

      - name: Build Auth (Go)
        run: |
          cd tech-challenge-fase-2-fiap/auth
          go build .

      - name: Build Evaluation (Go)
        run: |
          cd tech-challenge-fase-2-fiap/evaluation
          go build .

      - name: Teste simples Python services
        run: |
          echo "Python services OK (flag/targeting/analytics)"
          ls tech-challenge-fase-2-fiap