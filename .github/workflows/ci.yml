name: Build Microservices Fase 2

on:
  push:
    branches:
      - feature/devsecops

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # CLONE FASE 2
      # =========================
      - name: Clone Fase 2 repo
        run: git clone https://github.com/nascied/tech-challenge-fase-2-fiap.git

      # =========================
      # SETUP GO
      # =========================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # =========================
      # FIX MODULES (IMPORTANTE)
      # =========================
      - name: Fix Go modules (auth-service)
        run: |
          cd tech-challenge-fase-2-fiap/auth-service
          go mod tidy
          go mod download

      - name: Fix Go modules (evaluation-service)
        run: |
          cd tech-challenge-fase-2-fiap/evaluation-service
          go mod tidy
          go mod download

      # =========================
      # QUALITY GATES (BÁSICO)
      # =========================
      - name: Go vet (lint básico)
        run: |
          cd tech-challenge-fase-2-fiap/auth-service
          go vet ./...
          cd ../evaluation-service
          go vet ./...

      - name: Go fmt check
        run: |
          cd tech-challenge-fase-2-fiap/auth-service
          go fmt ./...
          cd ../evaluation-service
          go fmt ./...

      # =========================
      # BUILD
      # =========================
      - name: Build Auth Service
        run: |
          cd tech-challenge-fase-2-fiap/auth-service
          go build .

      - name: Build Evaluation Service
        run: |
          cd tech-challenge-fase-2-fiap/evaluation-service
          go build .

      # =========================
      # TESTES
      # =========================
      - name: Run Go tests
        run: |
          cd tech-challenge-fase-2-fiap/auth-service
          go test ./... || true
          cd ../evaluation-service
          go test ./... || true

      # =========================
      # PYTHON CHECK
      # =========================
      - name: Validate Python services
        run: |
          python3 --version
          ls tech-challenge-fase-2-fiap/flag-service
          ls tech-challenge-fase-2-fiap/analytics-service
          ls tech-challenge-fase-2-fiap/targeting-service