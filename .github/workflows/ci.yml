name: Build Microservices Fase 2

on:
  push:
    branches:
      - feature/devsecops

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fase 3
        uses: actions/checkout@v4

      - name: Clonar fase 2
        run: git clone https://github.com/nascied/tech-challenge-fase-2-fiap.git

      - name: Ver estrutura da fase 2
        run: |
          ls -R tech-challenge-fase-2-fiap

      # =========================
      # SETUP GO
      # =========================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # =========================
      # AUTH SERVICE (GO)
      # =========================
      - name: Build Auth (Go)
        run: |
          cd tech-challenge-fase-2-fiap/auth-service
          go mod tidy
          go mod download
          go build .

      # =========================
      # EVALUATION SERVICE (GO)
      # =========================
      - name: Build Evaluation (Go)
        run: |
          cd tech-challenge-fase-2-fiap/evaluation-service
          go mod tidy
          go mod download
          go build .

      # =========================
      # PYTHON SERVICES (VALIDAÇÃO SIMPLES)
      # =========================
      - name: Teste serviços Python
        run: |
          python3 --version
          echo "Flag service:"
          ls tech-challenge-fase-2-fiap/flag-service
          echo "Analytics service:"
          ls tech-challenge-fase-2-fiap/analytics-service
          echo "Targeting service:"
          ls tech-challenge-fase-2-fiap/targeting-service