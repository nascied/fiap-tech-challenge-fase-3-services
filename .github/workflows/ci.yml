name: Build Microservices Fase 2

on:
  push:
    branches:
      - feature/devsecops

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fase 3
        uses: actions/checkout@v4

      - name: Clonar fase 2
        run: git clone https://github.com/nascied/tech-challenge-fase-2-fiap.git

      - name: Ver estrutura
        run: ls -R tech-challenge-fase-2-fiap

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # =========================
      # AUTH SERVICE
      # =========================
      - name: Auth - deps + quality + test + build
        run: |
          cd tech-challenge-fase-2-fiap/auth-service
          go mod tidy
          go mod download
          go vet ./...
          go fmt ./...
          go test ./...
          go build .

      # =========================
      # EVALUATION SERVICE
      # =========================
      - name: Evaluation - deps + quality + test + build
        run: |
          cd tech-challenge-fase-2-fiap/evaluation-service
          go mod tidy
          go mod download
          go vet ./...
          go fmt ./...
          go test ./...
          go build .

      # =========================
      # PYTHON SERVICES (CHECK)
      # =========================
      - name: Python services check
        run: |
          python3 --version
          ls tech-challenge-fase-2-fiap/flag-service
          ls tech-challenge-fase-2-fiap/analytics-service
          ls tech-challenge-fase-2-fiap/targeting-service